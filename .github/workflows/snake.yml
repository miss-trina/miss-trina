name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"  #runs every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from Github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: miss-trina
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=blueviolet
            dist/github-contribution-grid-snake-dark.svg?color_snake=blueviolet&palette=github-dark

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
